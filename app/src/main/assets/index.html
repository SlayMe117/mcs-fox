<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MCS Fox</title>
<style>
  :root{
    --bg:#0e1319; --panel:#192029; --panel2:#121821; --line:#283542; --chip:#0c1116;
    --text:#e7edf3; --muted:#8197ab; --accent:#3da9fc; --ok:#46c08a; --err:#e56a6a; --warn:#e0a44a;
    --num:#3da9fc; --bool:#46c08a; --enum:#c07ae0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font:15px/1.4 -apple-system,Roboto,"Segoe UI",sans-serif;display:flex;flex-direction:column}
  header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px}
  header b{font-size:16px;letter-spacing:.3px}
  header .sub{color:var(--muted);font-size:12px}
  header .edit{margin-left:auto;color:var(--accent);font-size:13px;background:none;border:0;width:auto;padding:6px}

  .form{padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .row{display:flex;gap:8px;margin-bottom:8px}
  .f{flex:1;display:flex;flex-direction:column;gap:3px}
  label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  input{background:var(--chip);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:10px;font-size:15px;width:100%}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);
    color:#04121f;font-weight:600;font-size:15px}
  button:disabled{opacity:.5}

  .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel2);
    border-bottom:1px solid var(--line)}
  .bar input{flex:1}
  .bar .mini{width:auto;padding:9px 12px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);font-weight:500;font-size:14px}
  #status{padding:7px 16px;font-size:13px;color:var(--muted);min-height:18px}
  #status.ok{color:var(--ok)} #status.err{color:var(--err)}

  #list{flex:1;overflow:auto;padding:4px 0 28px}
  .grp{color:var(--muted);font-size:11px;letter-spacing:.4px;padding:12px 16px 4px;
    text-transform:uppercase;border-top:1px solid var(--line)}
  .pt{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #1b232d}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:5px;
    letter-spacing:.3px;flex-shrink:0;width:28px;text-align:center}
  .b-numeric{background:rgba(61,169,252,.16);color:var(--num)}
  .b-boolean{background:rgba(70,192,138,.16);color:var(--bool)}
  .b-enum{background:rgba(192,122,224,.16);color:var(--enum)}
  .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ro{color:var(--muted);font-size:10px;margin-left:6px}
  .val{background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:5px 10px;
    font-variant-numeric:tabular-nums;font-size:14px;min-width:54px;text-align:center}
  .val.wr{border-color:#2f4a63;color:var(--accent)}
  .val.pending{opacity:.5}
  .toggle{width:46px;height:26px;border-radius:14px;background:#2a3542;position:relative;flex-shrink:0}
  .toggle.on{background:var(--bool)}
  .toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on i{left:23px}
  .edit{display:flex;gap:6px;align-items:center}
  .edit input{width:84px;padding:6px 8px;text-align:right}
  .edit .ic{width:34px;padding:6px 0;font-size:16px}
  .ic.ok{background:var(--ok);color:#04121f}
  .ic.no{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
  .note{color:var(--warn);font-size:12px;padding:0 16px 6px}
  .empty{color:var(--muted);text-align:center;padding:40px 16px}
</style>
</head>
<body>
<header>
  <div>
    <b id="hTitle">MCS Fox</b>
    <div class="sub" id="hSub">MCS network • прямое подключение</div>
  </div>
  <button class="edit" id="editBtn" style="display:none" onclick="showForm()">изменить</button>
</header>

<div class="form" id="form">
  <div class="row">
    <div class="f" style="flex:2"><label>Адрес станции</label><input id="host" placeholder="192.168.0.x" autocapitalize="off" autocorrect="off"></div>
    <div class="f" style="flex:.7"><label>Порт</label><input id="port" value="1911" inputmode="numeric"></div>
  </div>
  <div class="row">
    <div class="f"><label>Пользователь</label><input id="user" autocapitalize="off" autocorrect="off"></div>
    <div class="f"><label>Пароль</label><input id="pass" type="password"></div>
    <div class="f" style="flex:.5"><label>Глубина</label><input id="depth" value="8" inputmode="numeric"></div>
  </div>
  <button id="go" onclick="connect()">Подключиться</button>
</div>

<div id="status"></div>

<div class="bar" id="bar" style="display:none">
  <input id="search" placeholder="поиск точки…" oninput="applyFilter()">
  <button class="mini" onclick="refresh()">Обновить</button>
</div>
<div class="note" id="note" style="display:none">Запись значений (set) — бета, проверяйте на безопасных точках.</div>

<div id="list"></div>

<script>
const $ = id => document.getElementById(id);
let POINTS = [];

try{ for(const k of ['host','user','depth','port']){ const v=localStorage.getItem('mcs_'+k); if(v)$(k).value=v; } }catch(e){}

function showForm(){ $('form').style.display='block'; $('bar').style.display='none'; $('note').style.display='none'; $('list').innerHTML=''; $('editBtn').style.display='none'; }

function connect(){
  const host=$('host').value.trim(), port=parseInt($('port').value)||1911;
  const user=$('user').value.trim(), pass=$('pass').value, depth=parseInt($('depth').value)||8;
  if(!host){ setStatus('Укажите адрес станции','err'); return; }
  try{ localStorage.setItem('mcs_host',host); localStorage.setItem('mcs_user',user);
       localStorage.setItem('mcs_depth',depth); localStorage.setItem('mcs_port',port); }catch(e){}
  $('go').disabled=true; setStatus('Подключаюсь к '+host+':'+port+' …');
  if(typeof Fox==='undefined'){ setStatus('Нет моста Fox (открыто вне приложения)','err'); $('go').disabled=false; return; }
  Fox.connect(host, port, user, pass, depth);
}
function refresh(){ const d=parseInt($('depth').value)||8; setStatus('Обновляю…'); Fox.refresh(d); }

function setStatus(t,cls){ const s=$('status'); s.textContent=t; s.className=cls||''; }
const clean = v => v ? String(v).split(' {')[0].trim() : '—';

window.onConnectResult = function(js){
  $('go').disabled=false;
  let r; try{ r=JSON.parse(js); }catch(e){ setStatus('Битый ответ','err'); return; }
  if(!r.ok){ setStatus(r.error||'Ошибка','err'); return; }
  if(r.station){ $('hTitle').textContent=r.station; $('hSub').textContent='MCS '+(r.version||'')+' • '+(r.points?r.points.length:0)+' точек'; }
  POINTS = r.points||[];
  $('form').style.display='none'; $('bar').style.display='flex'; $('note').style.display='block'; $('editBtn').style.display='block';
  setStatus('✓ подключено, точек: '+POINTS.length,'ok');
  render(POINTS);
};

function applyFilter(){
  const q=$('search').value.toLowerCase().trim();
  render(q ? POINTS.filter(p=>(p.name+' '+p.path).toLowerCase().includes(q)) : POINTS);
}

function render(pts){
  const list=$('list'); list.innerHTML='';
  if(!pts.length){ list.innerHTML='<div class="empty">Точек нет</div>'; return; }
  const groups={};
  for(const p of pts){ (groups[p.path]=groups[p.path]||[]).push(p); }
  for(const path of Object.keys(groups).sort()){
    const g=document.createElement('div'); g.className='grp'; g.textContent=path||'/'; list.appendChild(g);
    for(const p of groups[path]) list.appendChild(rowFor(p));
  }
}

function rowFor(p){
  const row=document.createElement('div'); row.className='pt'; row.dataset.handle=p.handle;
  const bd=document.createElement('span'); bd.className='badge b-'+p.kind;
  bd.textContent=p.kind==='numeric'?'123':p.kind==='boolean'?'0/1':'enum';
  row.appendChild(bd);
  const nm=document.createElement('span'); nm.className='nm'; nm.textContent=p.name;
  if(!p.writable){ const ro=document.createElement('span'); ro.className='ro'; ro.textContent='ro'; nm.appendChild(ro); }
  row.appendChild(nm);
  row.appendChild(control(p));
  return row;
}

function control(p){
  if(p.kind==='boolean' && p.writable){
    const on = /true|on|1|вкл/i.test(clean(p.value));
    const t=document.createElement('div'); t.className='toggle'+(on?' on':''); t.innerHTML='<i></i>';
    t.onclick=()=>{ const nv=!t.classList.contains('on'); t.classList.add('pending');
      Fox.setValue(p.handle,'boolean',nv?'true':'false'); };
    return t;
  }
  const v=document.createElement('span'); v.className='val'+(p.writable?' wr':''); v.textContent=clean(p.value);
  if(p.writable){ v.onclick=()=>openEdit(v,p); }
  return v;
}

function openEdit(chip,p){
  const box=document.createElement('span'); box.className='edit';
  const inp=document.createElement('input');
  inp.value = p.kind==='numeric' ? (parseFloat(clean(p.value))||'') : clean(p.value);
  if(p.kind==='numeric') inp.inputMode='decimal';
  if(p.kind==='enum'){ inp.inputMode='numeric'; inp.placeholder='№'; }
  const ok=document.createElement('button'); ok.className='ic ok'; ok.textContent='✓';
  const no=document.createElement('button'); no.className='ic no'; no.textContent='✕';
  ok.onclick=()=>{ box.classList.add('pending'); Fox.setValue(p.handle, p.kind, inp.value.trim()); };
  no.onclick=()=>{ chip.textContent=clean(p.value); box.replaceWith(chip); };
  box.append(inp,ok,no); chip.replaceWith(box); inp.focus();
}

window.onSetResult = function(js){
  let r; try{ r=JSON.parse(js);}catch(e){ return; }
  const row=document.querySelector('.pt[data-handle="'+r.handle+'"]'); if(!row) return;
  const p = POINTS.find(x=>x.handle===r.handle);
  if(r.ok && p) p.value=r.value;
  // перерисовать управляющий элемент строки
  const old = row.lastChild; old.remove();
  row.appendChild(control(p));
  if(r.ok) setStatus('✓ записано: '+(p?p.name:'')+' = '+clean(r.value),'ok');
  else setStatus('Ошибка записи: '+(r.error||''),'err');
};
</script>
</body>
</html>
